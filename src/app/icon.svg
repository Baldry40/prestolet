<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0c4a6e"/>

  <!-- Cube body -->
  <polygon points="16,2 28,8.5 28,23.5 16,30 4,23.5 4,8.5" fill="#111827"/>

  <!-- Top face -->
  <polygon points="16,2 28,8.5 16,15 4,8.5" fill="#1e3a5f"/>

  <!-- Left face shadow -->
  <polygon points="4,8.5 16,15 16,30 4,23.5" fill="#0a0a0a"/>

  <!-- Primary lines -->
  <line x1="16" y1="2"  x2="16" y2="30"  stroke="rgba(255,255,255,0.55)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="4"  y1="8.5" x2="28" y2="23.5" stroke="rgba(255,255,255,0.45)" stroke-width="1"   stroke-linecap="round"/>
  <line x1="28" y1="8.5" x2="4"  y2="23.5" stroke="rgba(255,255,255,0.45)" stroke-width="1"   stroke-linecap="round"/>

  <!-- Detail lines -->
  <line x1="4"  y1="16" x2="16" y2="8.5"  stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <line x1="4"  y1="16" x2="16" y2="23.5" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <line x1="28" y1="16" x2="16" y2="8.5"  stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <line x1="28" y1="16" x2="16" y2="23.5" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
</svg>
